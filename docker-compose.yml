# Optional local Postgres for development. Start with: npm run db:up
# Matches the local DATABASE_URL that scripts/setup-env.js writes to .env:
#   postgres://ogv_app:<DB_PASSWORD>@127.0.0.1:5432/ogv_finder
services:
  db:
    image: postgres:16
    container_name: ogv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ogv_finder
      POSTGRES_USER: ogv_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ogv-postgres-data:/var/lib/postgresql/data

volumes:
  ogv-postgres-data:
